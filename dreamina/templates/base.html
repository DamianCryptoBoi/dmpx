<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}Dreamina proxy{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/app.css">
  <script src="/admin/static/app.js" defer></script>
</head>
<body>
{% block body %}
<header class="topbar">
  <a class="brand" href="/admin">Dreamina proxy</a>
  <nav>
    <a href="/admin" {% if nav == "overview" %}aria-current="page"{% endif %}>Overview</a>
    <a href="/admin/accounts" {% if nav == "accounts" %}aria-current="page"{% endif %}>Accounts</a>
    <a href="/admin/jobs" {% if nav in ("jobs", "job") %}aria-current="page"{% endif %}>Jobs</a>
    <a href="/admin/models" {% if nav == "models" %}aria-current="page"{% endif %}>Models</a>
  </nav>
  <form method="post" action="/admin/logout" class="logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="ghost">Log out</button>
  </form>
</header>
<main>
  {% if flash %}<div class="flash flash-{{ flash[0] }}" role="status">{{ flash[1] }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
</body>
</html>
